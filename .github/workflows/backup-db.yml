# Backup semanal do banco (PostgreSQL / Supabase), grátis, via GitHub Actions.
#
# O que faz: todo domingo (e sob demanda) tira um pg_dump do schema "public",
# CRIPTOGRAFA com senha (o banco tem CPF e dados de saúde ocupacional) e guarda
# como "artifact" deste repositório por 90 dias.
#
# Configuração única (Settings > Secrets and variables > Actions > New repository secret):
#   DATABASE_URL       string de conexão do banco (a mesma do Render)
#   BACKUP_PASSPHRASE  senha inventada por você para criptografar os backups.
#                      GUARDE NO GERENCIADOR DE SENHAS: sem ela o backup não abre.
#
# Rodar agora: aba Actions > "Backup do banco" > Run workflow.
# Baixar: Actions > execução desejada > Artifacts (fim da página).
#
# Restaurar (precisa de PostgreSQL client 17 instalado; use um banco NOVO/VAZIO):
#   gpg --output backup.dump --decrypt ecosegme_AAAAMMDD_HHMMSS.dump.gpg
#   pg_restore --no-owner --no-privileges --dbname "URL_DO_BANCO_NOVO" backup.dump
#
# Fora do escopo: os PDFs guardados no Supabase Storage (bucket "laudos") não estão
# neste backup — os relatórios podem ser gerados de novo a partir dos dados.
# Em falha, o GitHub avisa por e-mail quem editou este arquivo por último.

name: Backup do banco

on:
  schedule:
    - cron: "0 6 * * 0"   # domingo 06:00 UTC (02:00 em Manaus)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar e criptografar o backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Secret DATABASE_URL não configurado"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Secret BACKUP_PASSPHRASE não configurado"; exit 1; }
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          pg_dump "$DATABASE_URL" --schema=public --format=custom --no-owner --no-privileges --file="ecosegme_${STAMP}.dump"
          pg_restore --list "ecosegme_${STAMP}.dump" > lista.txt
          grep -q "TABLE DATA" lista.txt || { echo "::error::Backup sem dados de tabela — algo está errado"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output "ecosegme_${STAMP}.dump.gpg" "ecosegme_${STAMP}.dump"
          rm "ecosegme_${STAMP}.dump" lista.txt
          ls -lh ecosegme_*.dump.gpg
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Guardar o backup por 90 dias
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco-${{ env.STAMP }}
          path: ecosegme_*.dump.gpg
          retention-days: 90
          if-no-files-found: error
